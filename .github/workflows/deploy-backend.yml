name: Build and Deploy Backend

on:
  push:
    branches:
      - main
  # Run by hand from the Actions tab. The first deploy to a fresh droplet needs a
  # retry loop that does not depend on inventing commits to main.
  workflow_dispatch:   # or your default branch

env:
  # Image lives in GitHub Container Registry, authenticated with the workflow's own
  # GITHUB_TOKEN. There is no personal access token to expire — an expired Docker Hub
  # PAT silently blocked every deploy from 2026-04-25 (run 50) to 2026-08-26 (run 53).
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Image name deploy/docker-compose.prod.yml references. The image pulled from GHCR
  # is retagged to this on the droplet, so compose starts the build this run produced.
  # Changing it here means changing it there too.
  DEPLOY_IMAGE: habtamuwgs/housing-platform-backend
  # Where the backend repo is checked out on the droplet. Override with an Actions
  # variable (Settings -> Secrets and variables -> Actions -> Variables) if it differs.
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ethiobuildconnect/housing-platform-backend' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The image namespace comes from REGISTRY_IMAGE (github.repository), not from this
          # field — GHCR authorizes on the token, so username is only an identity label.
          # Use repository_owner rather than github.actor so it always matches that namespace
          # even when a collaborator or a bot is the one who pushed.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}

  # Split from `build` so the credential handed to the droplet is read-only: job-level
  # permissions scope GITHUB_TOKEN, and this job never needs to push.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    # GitHub repo secrets (Settings → Secrets and variables → Actions):
    #   DO_HOST, DO_SSH_USER, DO_SSH_KEY — droplet access
    #   FRONTEND_BASE_URL — e.g. https://your-app.com (password-reset emails)
    #   SUPPORT_CHAT_API_BASE_URL — optional; default https://api.openai.com/v1 if unset
    #   SUPPORT_CHAT_API_KEY — OpenAI-compatible API key (or leave unset for offline fallback)
    #   SUPPORT_CHAT_MODEL — optional; default gpt-4o-mini if unset
    #   CHAPA_SECRET_KEY / CHAPA_WEBHOOK_SECRET — optional while testing (application.yml has test
    #     defaults); required with fresh values before going live
    #   CHAPA_BASE_URL — optional; defaults to https://api.chapa.global/v1 (application.yml)
    #   PUBLIC_API_BASE_URL — public URL of this API, used for Chapa's callback_url
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are no longer used and can be deleted.
    steps:
      - name: Deploy on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Short-lived, repo-scoped, read-only. Expires when this job ends.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          DEPLOY_IMAGE: ${{ env.DEPLOY_IMAGE }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SHA: ${{ github.sha }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          SUPPORT_CHAT_API_BASE_URL: ${{ secrets.SUPPORT_CHAT_API_BASE_URL }}
          SUPPORT_CHAT_API_KEY: ${{ secrets.SUPPORT_CHAT_API_KEY }}
          SUPPORT_CHAT_MODEL: ${{ secrets.SUPPORT_CHAT_MODEL }}
          CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
          CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET }}
          CHAPA_BASE_URL: ${{ secrets.CHAPA_BASE_URL }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE,DEPLOY_IMAGE,DEPLOY_DIR,SHA,FRONTEND_BASE_URL,SUPPORT_CHAT_API_BASE_URL,SUPPORT_CHAT_API_KEY,SUPPORT_CHAT_MODEL,CHAPA_SECRET_KEY,CHAPA_WEBHOOK_SECRET,CHAPA_BASE_URL,PUBLIC_API_BASE_URL
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # The stack definition is versioned in this repo now, so pull it before
            # using it — otherwise a compose change merged here never reaches the
            # droplet and the deploy silently runs the previous topology.
            git pull --ff-only
            COMPOSE="docker compose -f deploy/docker-compose.prod.yml"

            # Re-export explicitly so docker compose can interpolate them, and so an
            # unset optional secret is an empty string rather than a `set -u` failure.
            export FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-}"
            export SUPPORT_CHAT_API_BASE_URL="${SUPPORT_CHAT_API_BASE_URL:-}"
            export SUPPORT_CHAT_API_KEY="${SUPPORT_CHAT_API_KEY:-}"
            export SUPPORT_CHAT_MODEL="${SUPPORT_CHAT_MODEL:-}"
            # Chapa: export only when the GitHub secret is set. An empty value would override the
            # defaults in application.yml, so unset secrets are left unset instead.
            for v in CHAPA_SECRET_KEY CHAPA_WEBHOOK_SECRET CHAPA_BASE_URL PUBLIC_API_BASE_URL; do
              if [ -n "${!v:-}" ]; then export "$v"; else unset "$v"; fi
            done

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Preserve the image currently serving traffic before promoting the new one.
            docker tag "$DEPLOY_IMAGE:latest" "$DEPLOY_IMAGE:rollback-$SHA" 2>/dev/null || true

            docker pull "$REGISTRY_IMAGE:$SHA"
            docker tag "$REGISTRY_IMAGE:$SHA" "$DEPLOY_IMAGE:latest"

            # Only this service and what it depends on (postgres, redis). A bare `up -d` would
            # also try to start frontend and caddy, and on a droplet the frontend workflow has
            # not reached yet that fails with "No such image: ...frontend:latest" — correct,
            # but it is the frontend's job, not this one's.
            $COMPOSE up -d backend

            # Health gate. Poll the app's own health endpoint until it reports healthy. Flyway runs
            # at startup, so a checksum mismatch or a bad migration surfaces here as a container that
            # never becomes healthy — exactly the failure that showed two green deploys while
            # production was down. On timeout, roll back to the image that was serving before and
            # fail the job so the deploy goes red.
            echo "Waiting for backend to become healthy..."
            healthy=false
            for i in $(seq 1 30); do
              # busybox wget exits 0 only on a 2xx response; anything else (connection refused
              # while booting, or a non-200 health status) is non-zero.
              if $COMPOSE exec -T backend wget -q -O /dev/null http://127.0.0.1:8080/actuator/health; then
                healthy=true; break
              fi
              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              echo "::error::Backend did not become healthy within 150s — rolling back."
              $COMPOSE logs --tail 60 backend || true
              docker tag "$DEPLOY_IMAGE:rollback-$SHA" "$DEPLOY_IMAGE:latest" 2>/dev/null \
                && $COMPOSE up -d backend \
                && echo "Rolled back to the previous image." \
                || echo "::warning::No previous image to roll back to."
              exit 1
            fi
            echo "Backend is healthy."

            docker image prune -f
