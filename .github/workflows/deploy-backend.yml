name: Build and Deploy Backend

on:
  push:
    branches:
      - main   # or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: habtamuwgs/housing-platform-backend:latest

      # GitHub repo secrets (Settings → Secrets and variables → Actions):
      #   FRONTEND_BASE_URL — e.g. https://your-app.com (password-reset emails)
      #   SUPPORT_CHAT_API_BASE_URL — optional; default https://api.openai.com/v1 if unset
      #   SUPPORT_CHAT_API_KEY — OpenAI-compatible API key (or leave unset for offline fallback)
      #   SUPPORT_CHAT_MODEL — optional; default gpt-4o-mini if unset
      - name: Deploy on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd ~/housing-platform
            export FRONTEND_BASE_URL="${{ secrets.FRONTEND_BASE_URL }}"
            export SUPPORT_CHAT_API_BASE_URL="${{ secrets.SUPPORT_CHAT_API_BASE_URL }}"
            export SUPPORT_CHAT_API_KEY="${{ secrets.SUPPORT_CHAT_API_KEY }}"
            export SUPPORT_CHAT_MODEL="${{ secrets.SUPPORT_CHAT_MODEL }}"
            docker pull habtamuwgs/housing-platform-backend:latest
            docker compose up -d backend
            docker image prune -f
