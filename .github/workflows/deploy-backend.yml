name: Build and Deploy Backend

on:
  push:
    branches:
      - main   # or your default branch

env:
  # Image lives in GitHub Container Registry, authenticated with the workflow's own
  # GITHUB_TOKEN. There is no personal access token to expire — an expired Docker Hub
  # PAT silently blocked every deploy from 2026-04-25 (run 50) to 2026-08-26 (run 53).
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Image name the droplet's ~/housing-platform/docker-compose.yml already references.
  # The image pulled from GHCR is retagged to this name on the server, so the compose
  # file (which is not in this repo) needs no change.
  DEPLOY_IMAGE: habtamuwgs/housing-platform-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The image namespace comes from REGISTRY_IMAGE (github.repository), not from this
          # field — GHCR authorizes on the token, so username is only an identity label.
          # Use repository_owner rather than github.actor so it always matches that namespace
          # even when a collaborator or a bot is the one who pushed.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}

  # Split from `build` so the credential handed to the droplet is read-only: job-level
  # permissions scope GITHUB_TOKEN, and this job never needs to push.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    # GitHub repo secrets (Settings → Secrets and variables → Actions):
    #   DO_HOST, DO_SSH_USER, DO_SSH_KEY — droplet access
    #   FRONTEND_BASE_URL — e.g. https://your-app.com (password-reset emails)
    #   SUPPORT_CHAT_API_BASE_URL — optional; default https://api.openai.com/v1 if unset
    #   SUPPORT_CHAT_API_KEY — OpenAI-compatible API key (or leave unset for offline fallback)
    #   SUPPORT_CHAT_MODEL — optional; default gpt-4o-mini if unset
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are no longer used and can be deleted.
    steps:
      - name: Deploy on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Short-lived, repo-scoped, read-only. Expires when this job ends.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          DEPLOY_IMAGE: ${{ env.DEPLOY_IMAGE }}
          SHA: ${{ github.sha }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          SUPPORT_CHAT_API_BASE_URL: ${{ secrets.SUPPORT_CHAT_API_BASE_URL }}
          SUPPORT_CHAT_API_KEY: ${{ secrets.SUPPORT_CHAT_API_KEY }}
          SUPPORT_CHAT_MODEL: ${{ secrets.SUPPORT_CHAT_MODEL }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE,DEPLOY_IMAGE,SHA,FRONTEND_BASE_URL,SUPPORT_CHAT_API_BASE_URL,SUPPORT_CHAT_API_KEY,SUPPORT_CHAT_MODEL
          script: |
            set -euo pipefail
            cd ~/housing-platform

            # Re-export explicitly so docker compose can interpolate them, and so an
            # unset optional secret is an empty string rather than a `set -u` failure.
            export FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-}"
            export SUPPORT_CHAT_API_BASE_URL="${SUPPORT_CHAT_API_BASE_URL:-}"
            export SUPPORT_CHAT_API_KEY="${SUPPORT_CHAT_API_KEY:-}"
            export SUPPORT_CHAT_MODEL="${SUPPORT_CHAT_MODEL:-}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Preserve the image currently serving traffic before promoting the new one.
            docker tag "$DEPLOY_IMAGE:latest" "$DEPLOY_IMAGE:rollback-$SHA" 2>/dev/null || true

            docker pull "$REGISTRY_IMAGE:$SHA"
            docker tag "$REGISTRY_IMAGE:$SHA" "$DEPLOY_IMAGE:latest"

            docker compose up -d backend
            docker image prune -f
