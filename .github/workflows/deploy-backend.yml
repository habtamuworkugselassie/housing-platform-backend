name: Build and Deploy Backend

on:
  push:
    branches:
      - main
  # Run by hand from the Actions tab. The first deploy to a fresh droplet needs a
  # retry loop that does not depend on inventing commits to main.
  workflow_dispatch:   # or your default branch

env:
  # Image lives in GitHub Container Registry, authenticated with the workflow's own
  # GITHUB_TOKEN. There is no personal access token to expire — an expired Docker Hub
  # PAT silently blocked every deploy from 2026-04-25 (run 50) to 2026-08-26 (run 53).
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # Image name deploy/docker-compose.prod.yml references. The image pulled from GHCR
  # is retagged to this on the droplet, so compose starts the build this run produced.
  # Changing it here means changing it there too.
  DEPLOY_IMAGE: habtamuwgs/housing-platform-backend
  # Where the backend repo is checked out on the droplet. Override with an Actions
  # variable (Settings -> Secrets and variables -> Actions -> Variables) if it differs.
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ethiobuildconnect/housing-platform-backend' }}

jobs:
  # Same checks as pull requests (ci.yml); the image is only built when they pass.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The image namespace comes from REGISTRY_IMAGE (github.repository), not from this
          # field — GHCR authorizes on the token, so username is only an identity label.
          # Use repository_owner rather than github.actor so it always matches that namespace
          # even when a collaborator or a bot is the one who pushed.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}

  # Split from `build` so the credential handed to the droplet is read-only: job-level
  # permissions scope GITHUB_TOKEN, and this job never needs to push.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    # GitHub repo secrets (Settings → Secrets and variables → Actions):
    #   DO_HOST, DO_SSH_USER, DO_SSH_KEY — droplet access
    #   FRONTEND_BASE_URL — e.g. https://your-app.com (password-reset emails)
    #   SUPPORT_CHAT_API_BASE_URL — optional; default https://api.openai.com/v1 if unset
    #   SUPPORT_CHAT_API_KEY — OpenAI-compatible API key (or leave unset for offline fallback)
    #   SUPPORT_CHAT_MODEL — optional; default gpt-4o-mini if unset
    #   CHAPA_SECRET_KEY / CHAPA_WEBHOOK_SECRET — optional while testing (application.yml has test
    #     defaults); required with fresh values before going live
    #   CHAPA_BASE_URL — optional; defaults to https://api.chapa.global/v1 (application.yml)
    #   PUBLIC_API_BASE_URL — public URL of this API, used for Chapa's callback_url
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are no longer used and can be deleted.
    steps:
      - name: Deploy on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Short-lived, repo-scoped, read-only. Expires when this job ends.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          DEPLOY_IMAGE: ${{ env.DEPLOY_IMAGE }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SHA: ${{ github.sha }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          SUPPORT_CHAT_API_BASE_URL: ${{ secrets.SUPPORT_CHAT_API_BASE_URL }}
          SUPPORT_CHAT_API_KEY: ${{ secrets.SUPPORT_CHAT_API_KEY }}
          SUPPORT_CHAT_MODEL: ${{ secrets.SUPPORT_CHAT_MODEL }}
          CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
          CHAPA_WEBHOOK_SECRET: ${{ secrets.CHAPA_WEBHOOK_SECRET }}
          CHAPA_BASE_URL: ${{ secrets.CHAPA_BASE_URL }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,REGISTRY_IMAGE,DEPLOY_IMAGE,DEPLOY_DIR,SHA,FRONTEND_BASE_URL,SUPPORT_CHAT_API_BASE_URL,SUPPORT_CHAT_API_KEY,SUPPORT_CHAT_MODEL,CHAPA_SECRET_KEY,CHAPA_WEBHOOK_SECRET,CHAPA_BASE_URL,PUBLIC_API_BASE_URL
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # The stack definition is versioned in this repo now, so pull it before
            # using it — otherwise a compose change merged here never reaches the
            # droplet and the deploy silently runs the previous topology.
            git pull --ff-only
            COMPOSE="docker compose -f deploy/docker-compose.prod.yml"

            # Re-export explicitly so docker compose can interpolate them, and so an
            # unset optional secret is an empty string rather than a `set -u` failure.
            export FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-}"
            export SUPPORT_CHAT_API_BASE_URL="${SUPPORT_CHAT_API_BASE_URL:-}"
            export SUPPORT_CHAT_API_KEY="${SUPPORT_CHAT_API_KEY:-}"
            export SUPPORT_CHAT_MODEL="${SUPPORT_CHAT_MODEL:-}"
            # Chapa: export only when the GitHub secret is set. An empty value would override the
            # defaults in application.yml, so unset secrets are left unset instead.
            for v in CHAPA_SECRET_KEY CHAPA_WEBHOOK_SECRET CHAPA_BASE_URL PUBLIC_API_BASE_URL; do
              if [ -n "${!v:-}" ]; then export "$v"; else unset "$v"; fi
            done

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Preserve the image currently serving traffic before promoting the new one.
            docker tag "$DEPLOY_IMAGE:latest" "$DEPLOY_IMAGE:rollback-$SHA" 2>/dev/null || true

            # The pull of the app layer takes minutes on the droplet and containerd has
            # twice lost the partially written layer mid-pull ("failed commit on ref ...
            # no such file or directory"). Retrying resumes from the layers already present.
            pulled=false
            for attempt in 1 2 3 4; do
              if docker pull "$REGISTRY_IMAGE:$SHA"; then pulled=true; break; fi
              echo "::warning::image pull attempt $attempt failed; retrying in 20s"
              sleep 20
            done
            [ "$pulled" = true ] || { echo "::error::could not pull $REGISTRY_IMAGE:$SHA"; exit 1; }
            docker tag "$REGISTRY_IMAGE:$SHA" "$DEPLOY_IMAGE:latest"

            # Flyway's V46 needs the pgvector extension and does not create it (on the old
            # managed database the migration user could not). The compose init script does
            # it for a fresh volume; this does it for one that already exists. Idempotent.
            # Database and uploads live in host directories, not Docker volumes. On a droplet
            # that still has the old named volumes this copies them across once, then is a
            # no-op forever after. See the script for the rules.
            bash deploy/migrate-volumes-to-host.sh

            $COMPOSE up -d postgres
            $COMPOSE exec -T postgres sh -c '
              until pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "CREATE EXTENSION IF NOT EXISTS vector;"'

            # Zero-downtime rollout: start the idle API slot (backend-blue / backend-green)
            # on the new image, wait for its health check, then stop the old slot. Flyway runs
            # in the new slot before it reports healthy, so a bad migration never takes over
            # traffic: the script leaves the old slot serving and exits non-zero. See the script.
            rollout_ok=true
            bash deploy/rollout-backend.sh || rollout_ok=false

            # Live video is opt-in (COMPOSE_PROFILES=live in deploy/.env). When it is on,
            # apply any change to livekit.yaml / the egress config too; otherwise leave
            # the services alone — starting them without keys would only crash-loop.
            if grep -qE '^COMPOSE_PROFILES=.*\blive\b' deploy/.env 2>/dev/null; then
              $COMPOSE up -d livekit livekit-egress
            fi

            # Compose does not recreate a container when a mounted file changes, so the new
            # Caddyfile is applied with a graceful reload (zero downtime, no-op if unchanged).
            # deploy/caddy/ is mounted as a directory so the container sees the pulled file.
            # Apply compose-level changes to the caddy service (image, mounts, ports) first:
            # a no-op when nothing changed, a recreate when something did.
            $COMPOSE up -d --no-deps caddy
            if ! $COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile; then
              echo "::warning::caddy reload failed; recreating the caddy container"
              $COMPOSE up -d --force-recreate --no-deps caddy
            fi
            sleep 2
            if curl -fsSI https://ethiobuildconnect.et/ | grep -qi '^strict-transport-security'; then
              echo "Caddy serving the current Caddyfile (security headers present)."
            else
              echo "::warning::security headers not seen on https://ethiobuildconnect.et/ after reload"
            fi

            if [ "$rollout_ok" != "true" ]; then
              echo "::error::Backend rollout failed — restoring the previous image tag."
              docker tag "$DEPLOY_IMAGE:rollback-$SHA" "$DEPLOY_IMAGE:latest" 2>/dev/null || true
              # The old slot normally kept serving. If nothing is up (first rollout on a host
              # without enough memory for two slots), bring the previous release back.
              if ! docker ps --filter label=com.docker.compose.project=ethiobuildconnect \
                     --format '{{.Label "com.docker.compose.service"}}' | grep -q '^backend'; then
                bash deploy/rollout-backend.sh && echo "Rolled back to the previous image." \
                  || echo "::warning::Rollback did not come up either; check the logs above."
              fi
              exit 1
            fi
            echo "Backend is healthy and serving."

            docker image prune -f
