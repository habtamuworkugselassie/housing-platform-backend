name: Build eTrade service image

on:
  push:
    branches: [main]
    paths:
      - "services/etrade-service/**"
      - ".github/workflows/build-etrade-service.yml"
  pull_request:
    paths:
      - "services/etrade-service/**"

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/etrade-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/etrade-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/etrade-service/pom.xml
      - run: chmod +x mvnw && ./mvnw -B verify

  build:
    # Image only on main; the droplet's compose file (outside this repo) pulls it as
    # ghcr.io/<owner>/housing-platform-backend/etrade-service:latest.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/etrade-service
          file: services/etrade-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
