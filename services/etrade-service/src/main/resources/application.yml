spring:
  application:
    name: etrade-service
  cache:
    type: caffeine

server:
  port: ${PORT:8085}
  address: 0.0.0.0
  error:
    include-message: on-param
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info}
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

# Ministry of Trade eTrade portal (https://etrade.gov.et): registration + licence lookup by TIN,
# the same data as https://etrade.gov.et/business-license-checker?tin=<TIN>. Public, no key.
etrade:
  # Comma-separated shared secrets callers send in X-API-Key. Empty = no auth (private network only).
  api-keys: ${ETRADE_SERVICE_API_KEYS:}
  cache-ttl: ${ETRADE_CACHE_TTL:6h}
  cache-max-size: ${ETRADE_CACHE_MAX_SIZE:5000}
  base-url: ${ETRADE_BASE_URL:https://etrade.gov.et}
  # eTrade answers 417 "Invalid referer header" unless the Referer is one of its own pages.
  referer: ${ETRADE_REFERER:https://etrade.gov.et/business-license-checker}
  user-agent: ${ETRADE_USER_AGENT:EthioBuildConnect-etrade-service/1.0 (+https://ethiobuildconnect.et)}
  # "en" gives Gregorian dates; "am" gives Ethiopian-calendar dates (not parsed).
  language: ${ETRADE_LANGUAGE:en}
  connect-timeout: ${ETRADE_CONNECT_TIMEOUT:10s}
  read-timeout: ${ETRADE_READ_TIMEOUT:30s}
  # etrade.gov.et omits its GlobalSign intermediate from the TLS handshake; the bundled copy makes
  # the chain verifiable. Turn off if the server starts sending a complete chain.
  trust-bundled-intermediate: ${ETRADE_TRUST_BUNDLED_INTERMEDIATE:true}
  intermediate-certificate: ${ETRADE_INTERMEDIATE_CERTIFICATE:classpath:etrade/globalsign-gcc-r3-ev-tls-ca-2025.pem}

logging:
  level:
    root: INFO
    com.housingplatform.etradeservice: ${LOG_LEVEL:INFO}
