# Production stack for a single droplet.
#
# This is the tracked replacement for the hand-maintained
# ~/housing-platform/docker-compose.yml the deploy workflows used to drive — the one
# both of them flag as "not in this repo". Keeping it here means a change to the stack
# arrives through review and a deploy, like any other change.
#
# The app images are NOT built here. .github/workflows/deploy-*.yml build them on
# GitHub's runners, push to GHCR, and retag them on the droplet to the names below.
# Building on the droplet instead would spend the site's own RAM on Maven and Vite.
#
# Run from the backend repo checkout on the droplet:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Deliberately NOT here: Kafka and Zookeeper. application.yml configures them, but
# nothing in src/main/java references Kafka at all, so running them would cost about
# 1.5 GB of RAM to carry a dependency the code never uses. If a Kafka consumer is
# ever added, they come back.
#
# Also not here: LiveKit. Live broadcasting is feature-flagged off and ships its own
# stack in infra/livekit/ — bring that up separately if and when it is turned on.

name: ethiobuildconnect

services:
  postgres:
    # pgvector, not plain postgres: the support-chat RAG stores embeddings in a
    # vector column, and a stock postgres image cannot create the extension.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-housing_platform}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # A host directory, not a named volume — see "Data on the host" below.
      - ${DATA_DIR:-/var/lib/ethiobuildconnect}/postgres:/var/lib/postgresql/data
      # Enables the vector extension on first initialisation; see the file.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # No ports: published. The database is reachable only on the compose network;
    # exposing 5432 on a public droplet is how these get found and drained.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-housing_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Caching and rate limiting only — nothing here needs to survive a restart, so
    # no volume and a hard memory ceiling rather than unbounded growth.
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    # The tag deploy-backend.yml retags the GHCR image to on the droplet. It must stay
    # in step with DEPLOY_IMAGE there, or a deploy pushes a new image that nothing runs.
    image: habtamuwgs/housing-platform-backend:latest
    # Never reach for a registry: this tag only ever exists locally, created by the
    # workflow. Without this, a missing tag sends compose to Docker Hub for a
    # repository that is not there, and the error names the wrong problem.
    pull_policy: never
    restart: unless-stopped
    # The service name is load-bearing: the frontend's nginx.conf proxies to
    # http://backend:8080 by this exact hostname.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-housing_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /var/lib/housing-platform/uploads
      # Without a ceiling the JVM takes a quarter of the host's RAM, which on a 4 GB
      # droplet starves Postgres during a traffic spike.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
    volumes:
      - ${DATA_DIR:-/var/lib/ethiobuildconnect}/uploads:/var/lib/housing-platform/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s
    mem_limit: 1800m
    networks: [internal]

  frontend:
    # As above: deploy-frontend.yml creates this tag on the droplet.
    # VITE_API_BASE_URL and VITE_PUBLIC_SITE_URL are baked in at build time on the
    # runner, not read here — see the build-args in that workflow.
    image: habtamuwgs/housing-platform-frontend:latest
    pull_policy: never
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      # Read-only: nginx serves uploaded media straight from disk, skipping Spring.
      # If this is missing, every listing photo 404s while the pages still render.
      - ${DATA_DIR:-/var/lib/ethiobuildconnect}/uploads:/var/lib/housing-platform/uploads:ro
    networks: [internal]

  caddy:
    # TLS terminator. The frontend container listens on :80 only and its config
    # assumes TLS is handled upstream; Caddy obtains and renews certificates for the
    # apex and www automatically.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # ------------------------------------------------------------ live video ----
  # Live broadcasting (Phase 5). Opt-in: these three only start when the "live" profile
  # is active — COMPOSE_PROFILES=live in deploy/.env turns it on for every compose
  # command. Without it the app runs and the live pages report "not configured".
  #
  # Sized for this droplet: recording is TrackComposite (a remux of the broadcaster's
  # own H.264/Opus tracks, no Chromium). RoomComposite egress — HLS, social simulcast,
  # multi-host recordings — drives a headless browser and needs ~4 vCPU / 8 GB; on a
  # 1 vCPU / 2 GB host it rebooted the previous droplet. See deploy/README.md §11.

  livekit-redis:
    # LiveKit's room state. Separate from the app's redis, which evicts under memory
    # pressure (allkeys-lru) — fine for a cache, fatal for a live room.
    image: redis:7-alpine
    profiles: [live]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  livekit:
    # Keep in step with the frontend's livekit-client: 1.8 could not publish video to
    # client 2.22 ("pcManager is not ready"). Bump server and egress together.
    image: livekit/livekit-server:v1.9
    profiles: [live]
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # "key: secret" map the server reads its credentials from.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    ports:
      - "7881:7881"          # ICE over TCP (UDP-blocked networks)
      - "7882:7882/udp"      # all WebRTC media, one muxed port
      - "3478:3478/udp"      # TURN/UDP
      # 7880 (signaling/API) is deliberately not published: Caddy proxies it with TLS.
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      livekit-redis: { condition: service_healthy }
    mem_limit: 512m
    networks: [internal]

  livekit-egress:
    image: livekit/egress:v1.9
    profiles: [live]
    restart: unless-stopped
    environment:
      # Whole config inline so the key/secret come from .env, not a tracked file.
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: livekit-redis:6379
        log_level: info
    volumes:
      # Recordings land in <uploads>/live-recordings, which the frontend already serves
      # at /api/v1/uploads/live-recordings/. The backend's livekit.recording-dir is
      # /out/live-recordings — a path inside THIS container.
      - ${DATA_DIR:-/var/lib/ethiobuildconnect}/uploads:/out
    depends_on:
      livekit: { condition: service_started }
    # No cap_add SYS_ADMIN: only the Chromium compositor (RoomComposite) needs it, and
    # that mode is not run on this host.
    mem_limit: 768m
    networks: [internal]

# Data on the host
#
# The database and uploaded media are bind mounts under DATA_DIR (default
# /var/lib/ethiobuildconnect), deliberately NOT named volumes. Docker only mounts a
# host directory; it never creates, owns or deletes one, so `compose down -v`,
# `volume prune`, `system prune --volumes` and a renamed project cannot remove the
# data. Only a human with a shell on the droplet can. Back them up from those paths.
#
# Caddy's certificates stay in named volumes: losing them costs a re-issue, nothing more.
volumes:
  caddy-data:
  caddy-config:

networks:
  internal:
