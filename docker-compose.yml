version: '3.8'

services:
  postgres:
    # Includes pgvector for support-chat semantic RAG (see db/migration/V46__support_rag_pgvector.sql)
    image: pgvector/pgvector:pg16
    container_name: housing-platform-postgres
    environment:
      POSTGRES_DB: housing_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: housing-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: housing-platform-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: housing-platform-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Standalone eTrade (Ministry of Trade) lookup service, from https://github.com/habtamuworkugselassie/business-etrade-validation.
  # The backend reads ETRADE_SERVICE_URL=http://localhost:8085 by default.
  etrade-service:
    image: ghcr.io/habtamuworkugselassie/business-etrade-validation:latest
    container_name: housing-platform-etrade-service
    environment:
      PORT: 8085
      # Keep in sync with the backend's ETRADE_SERVICE_API_KEY. Empty = open (local dev).
      ETRADE_SERVICE_API_KEYS: ${ETRADE_SERVICE_API_KEYS:-}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
