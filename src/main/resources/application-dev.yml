spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/housing_platform_production_snapshot}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  security:
    oauth2:
      resourceserver:
        jwt:
          # For development, you can use a mock OAuth2 server or disable security
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/auth/realms/housing-platform}

logging:
  level:
    com.housingplatform: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters-long}
  expiration: ${JWT_EXPIRATION:3600}
  issuer: ${JWT_ISSUER:housing-platform}
