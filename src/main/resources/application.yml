spring:
  application:
    name: ethio-build-connect
  
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      # Redis is only used for rate limiting, not for caching
      # Cache uses Caffeine (in-memory)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      # Disable Redis cache auto-configuration
      repositories:
        enabled: false
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 120MB
      file-size-threshold: 2KB
  web:
    resources:
      add-mappings: false
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: housing-platform-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/auth/realms/housing-platform}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: false
    mail:
      enabled: false
    defaults:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  # Discover every @RestController under the application (including /exhibition/**, etc.)
  packages-to-scan: com.housingplatform
  # Expose Spring Boot Actuator endpoints in the same OpenAPI document (health, info, metrics, …)
  show-actuator: true
  use-management-port: false

logging:
  level:
    root: INFO
    com.housingplatform: INFO
    org.springframework.security: WARN
    org.springframework.security.web: WARN
    org.springframework.security.web.FilterChainProxy: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.security.oauth2.server.resource: WARN
    org.springframework.web: INFO
    org.springframework.web.filter: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    # Suppress error logging for expected JWT expiration exceptions
    org.springframework.security.oauth2.server.resource.authentication.JwtAuthenticationProvider: WARN
    org.springframework.security.oauth2.server.resource.web.authentication.BearerTokenAuthenticationFilter: WARN

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  support-chat:
    enabled: ${SUPPORT_CHAT_ENABLED:true}
    # OpenAI-compatible HTTP API: OpenAI, Groq (free tier), OpenRouter, Together, local Ollama proxy, etc.
    # Groq (free tier, no card): set SUPPORT_CHAT_API_BASE_URL=https://api.groq.com/openai/v1 and
    # SUPPORT_CHAT_MODEL=llama-3.3-70b-versatile — get key at https://console.groq.com
    api-base-url: ${SUPPORT_CHAT_API_BASE_URL:https://api.openai.com/v1}
    api-key: ${SUPPORT_CHAT_API_KEY:${OPENAI_API_KEY:}}
    model: ${SUPPORT_CHAT_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
    # RAG: inject live DB snippets (properties / orgs / buildings) into the LLM prompt — no vector DB
    rag-enabled: ${SUPPORT_CHAT_RAG_ENABLED:true}
    # pgvector semantic index (requires PostgreSQL pgvector extension + table from V46 migration)
    rag-vector-enabled: ${SUPPORT_CHAT_RAG_VECTOR_ENABLED:false}
    rag-vector-replaces-lexical-rag: ${SUPPORT_CHAT_RAG_VECTOR_REPLACES_LEXICAL:true}
    rag-vector-top-k: ${SUPPORT_CHAT_RAG_VECTOR_TOP_K:16}
    rag-embedding-model: ${SUPPORT_CHAT_RAG_EMBEDDING_MODEL:text-embedding-3-small}
    rag-embedding-dimensions: ${SUPPORT_CHAT_RAG_EMBEDDING_DIMENSIONS:1536}
    rag-max-properties: ${SUPPORT_CHAT_RAG_MAX_PROPERTIES:12}
    rag-max-organizations: ${SUPPORT_CHAT_RAG_MAX_ORGANIZATIONS:8}
    rag-max-chars: ${SUPPORT_CHAT_RAG_MAX_CHARS:4500}
    # Include all ACTIVE exhibition sponsorship packages (same source as /api/v1/sponsorships/active)
    rag-include-sponsorship-packages: ${SUPPORT_CHAT_RAG_INCLUDE_SPONSORSHIP:true}
    # Ranked marketplace directory (orgs by type + contact + verification + reviews; listings ditto)
    rag-include-marketplace-directory: ${SUPPORT_CHAT_RAG_INCLUDE_MARKETPLACE_DIRECTORY:${SUPPORT_CHAT_RAG_INCLUDE_REAL_ESTATE_DIRECTORY:true}}
    rag-max-directory-organizations: ${SUPPORT_CHAT_RAG_MAX_DIRECTORY_ORGANIZATIONS:${SUPPORT_CHAT_RAG_MAX_REAL_ESTATE_COMPANIES:15}}
    rag-max-directory-properties: ${SUPPORT_CHAT_RAG_MAX_DIRECTORY_PROPERTIES:15}
    rag-directory-property-candidate-pool: ${SUPPORT_CHAT_RAG_DIRECTORY_PROPERTY_POOL:400}
  password-reset:
    expiry-hours: ${PASSWORD_RESET_EXPIRY_HOURS:1}
  # Directory for storing uploaded media (property/org images). Only URLs are stored in DB.
  upload-dir: ${UPLOAD_DIR:./uploads}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:3600}
  issuer: ${JWT_ISSUER:housing-platform}

# Self-hosted LiveKit (Phase 5 live broadcasting). Empty by default — the live
# features report "not configured" until these are set. See infra/livekit/.
livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

rate:
  limit:
    auth:
      enabled: ${RATE_LIMIT_AUTH_ENABLED:false}
      max-requests: ${RATE_LIMIT_AUTH_MAX_REQUESTS:5}
      window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:}
