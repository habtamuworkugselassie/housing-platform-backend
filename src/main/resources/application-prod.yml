app:
  upload-dir: ${UPLOAD_DIR:/var/lib/housing-platform/uploads}

spring:
  jpa:
    show-sql: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-d5n4qh75r7bs73dhebd0-a.virginia-postgres.render.com:5432/housing_platform_shvt}
    username: ${SPRING_DATASOURCE_USERNAME:housing_platform}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

logging:
  level:
    # root WARN hides most framework INFO (including Spring Boot startup). Explicit loggers below
    # restore visibility in hosted "Logs" UIs (Render, etc.) without flooding all of Spring.
    root: WARN
    com.housingplatform: INFO
    org.springframework.boot: INFO
    org.flywaydb: INFO
    org.springframework.security: WARN
    org.springframework.security.web: WARN
    org.springframework.security.web.FilterChainProxy: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.security.oauth2.server.resource: WARN
    org.springframework.web: WARN
    org.springframework.web.filter: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  error:
    include-message: on-param
    include-binding-errors: on-param
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health}
  health:
    redis:
      enabled: false
    mail:
      enabled: false

# Rate limiting: on in production (dev leaves it off for convenience). The filter fails open
# if Redis is unreachable, so this cannot lock users out — it only caps brute-force attempts.
rate:
  limit:
    auth:
      enabled: ${RATE_LIMIT_AUTH_ENABLED:true}

# API docs are a development aid; exposing the full endpoint map and a live request console in
# production is unnecessary attack surface. Flip SWAGGER_ENABLED=true only for a debugging window.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Actuator: health only (for the deploy gate and uptime checks). The previous config also exposed
# info, metrics and prometheus publicly; scrape those from a private network or behind auth instead.
